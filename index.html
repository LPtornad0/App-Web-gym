<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#171614" />
  <meta name="manifest" content="/manifest.json">
  <title>Gym Progress Mobile</title>
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/tokens.css">
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/components.css">
  <link rel="stylesheet" href="./assets/css/views.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>Gym Progress Mobile</h1>
      <p>Une app installable sur ton telephone, sans Play Store.</p>
      <div id="profileSelector" style="display:flex;gap:0.5rem;align-items:center;margin-top:var(--space-2);"></div>
      <div class="actions" style="margin-top:var(--space-2);">
        <button class="btn btn-primary install" id="installBtn">Installer</button>
        <button class="btn" id="themeBtn">&#127769;</button>
        <button class="btn btn-ghost" id="exportBtn">Exporter</button>
      </div>
    </header>

    <section class="view active" id="dashboard" data-fragment="dashboard"></section>
    <section class="view" id="workouts" data-fragment="workouts"></section>
    <section class="view" id="measurements" data-fragment="measurements"></section>
    <section class="view" id="goals" data-fragment="goals"></section>
    <section class="view" id="settings" data-fragment="settings"></section>

    <nav class="bottom-nav">
      <button class="active" data-target="dashboard">Accueil</button>
      <button data-target="workouts">Seances</button>
      <button data-target="measurements">Mesures</button>
      <button data-target="goals">Objectifs</button>
      <button data-target="settings">Reglages</button>
    </nav>
  </div>

  <script src="./assets/js/state.js"></script>
  <script src="./assets/js/charts.js"></script>
  <script src="./assets/js/ui.js"></script>
  <script src="./assets/js/forms.js"></script>
  <script src="./assets/js/pwa.js"></script>
  <script src="./assets/js/partials.js"></script>
  <script src="./assets/js/app.js"></script>
</body>
</html>
